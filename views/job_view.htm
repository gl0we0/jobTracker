<div class="job-view-workspace">
    <div class="job-view-main-panel">
        <div id="jobFormContainerOuter"><!-- Alpaca Form Insertion here--></div><!-- Alpaca Form Insertion ends here-->
    </div>
    <aside id="jobViewCurtainPanel" class="curtain-side-panel">
        <button
            type="button"
            class="curtain-side-tab"
            data-curtain-panel-toggle
            aria-controls="jobViewCurtainPanel"
            aria-expanded="true">
            <span class="curtain-side-tab__icon glyphicon glyphicon-list-alt" aria-hidden="true"></span>
            <span class="curtain-side-tab__label">Hide Tools</span>
        </button>
        <div class="curtain-side-panel__inner">
            <div class="tool-panel-toolbar" role="tablist" aria-label="Job tools">
                <button type="button" class="tool-panel-tab is-active" data-tool-frame-trigger data-tool-target="curtain" aria-selected="true">Curtain Pricing</button>
                <button type="button" class="tool-panel-tab" data-tool-frame-trigger data-tool-target="rail" aria-selected="false">Rail Bending</button>
            </div>
            <div class="tool-panel-frames">
                <iframe
                    class="curtain-pricing-frame tool-frame-pane is-active"
                    data-tool-frame="curtain"
                    src="/tools/curtain-pricing.html"
                    title="Curtain Pricing Panel"
                    loading="lazy">
                </iframe>
                <iframe
                    class="curtain-pricing-frame tool-frame-pane"
                    data-tool-frame="rail"
                    data-src="/tools/rail-bending.html"
                    title="Rail Bending Panel"
                    loading="lazy"
                    hidden>
                </iframe>
            </div>
        </div>
    </aside>
</div>

<!-- TimLineModal -->
<div class="modal fade" id="timelineModal" tabindex="-1" role="dialog" aria-labelledby="timelineModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="timelineModalLabel">Event Timeline</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Timeline events go here -->
                <ul class="list-group" id="jobViewTimeLine"></ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Unsaved Changes Modal -->
<div class="modal fade" id="jobUnsavedModal" tabindex="-1" role="dialog" aria-labelledby="jobUnsavedModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h5 class="modal-title" id="jobUnsavedModalLabel">Unsaved Changes</h5>
            </div>
            <div class="modal-body">
                <p>You have unsaved changes. What would you like to do?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" id="jobUnsavedCancelButton" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="jobUnsavedDiscardButton">Discard</button>
                <button type="button" class="btn btn-primary" id="jobUnsavedSaveButton">Save</button>
            </div>
        </div>
    </div>
</div>
